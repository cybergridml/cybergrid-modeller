name: Publish release JAR

"on":
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to publish, for example '1.2.3' or 'v1.2.3'"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  PROJECT_DIR: CybergridML

jobs:
  publish:
    name: Build and publish release asset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported tag '$TAG'. Expected 'x.y.z' or 'vx.y.z', for example '1.2.3' or 'v1.2.3'." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_name=cybergridml-app-$VERSION.jar" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.7.0"
          cache: npm

      - name: Configure npm authentication for GitHub Packages
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}" >> .npmrc

      - name: Install frontend dependencies
        shell: bash
        run: npm install --legacy-peer-deps

      - name: Build frontend
        shell: bash
        run: npm run build

      - name: Copy frontend build into backend static resources
        shell: bash
        run: |
          STATIC_DIR="$PROJECT_DIR/src/main/resources/static"
          rm -rf "${STATIC_DIR:?}"/*
          mkdir -p "$STATIC_DIR"
          cp -R frontend/cybergridml/dist/. "$STATIC_DIR"/

      - name: Configure Maven authentication for GitHub Packages
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-syson</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-sirius-web</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-sirius-emfjson</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build JAR
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./mvnw
          ./mvnw -B -ntp -Drevision="${{ steps.version.outputs.version }}" -DskipTests clean package

      - name: Locate release JAR
        id: jar
        shell: bash
        run: |
          JAR_PATH="$PROJECT_DIR/target/${{ steps.version.outputs.jar_name }}"

          if [[ ! -f "$JAR_PATH" ]]; then
            echo "Expected JAR not found: $JAR_PATH" >&2
            echo "Available target files:" >&2
            find "$PROJECT_DIR/target" -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi

          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          build-args: |
            JAR_FILE=target/${{ steps.version.outputs.jar_name }}
          push: true
          tags: |
            ghcr.io/cybergridml/cybergrid-modeller:${{ steps.version.outputs.version }}
            ghcr.io/cybergridml/cybergrid-modeller:latest

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          JAR_PATH="${{ steps.jar.outputs.path }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR_PATH" --clobber
          else
            gh release create "$TAG" "$JAR_PATH" \
              --title "$TAG" \
              --generate-notes
          fi
