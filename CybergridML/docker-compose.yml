services:
  database:
    container_name: Nacre_db
    image: postgres:15
    environment:
      POSTGRES_DB: Nacre-db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpwd
      PGDATA: /data/postgres
    ports:
      - "5434:5432"
    volumes:
      - Nacre_db_data:/data/postgres
volumes:
  Nacre_db_data:
    external: true
    name: nacrerte_Nacre_db_data


