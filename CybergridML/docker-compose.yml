services:
  database:
    container_name: CybergridML_db
    image: postgres:15
    environment:
      POSTGRES_DB: CybergridML-db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpwd
      PGDATA: /data/postgres
    ports:
      - "5433:5432"
    volumes:
      - CybergridML_db_data:/data/postgres
volumes:
  CybergridML_db_data:


